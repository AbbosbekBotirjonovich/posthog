name: posthog_dart
description: >-
  Pure-Dart PostHog SDK that works identically on Windows, Linux, Android, iOS,
  macOS and Web. API-compatible with the official posthog_flutter plugin.
version: 0.1.0
repository: https://github.com/AbbosbekBotirjonovich/posthog
issue_tracker: https://github.com/AbbosbekBotirjonovich/posthog/issues

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # Transport and persistence
  http: ^1.2.0
  path_provider: ^2.1.0

  # Required by the code copied from the official plugin
  plugin_platform_interface: ^2.0.2
  meta: ^1.3.0
  stack_trace: ^1.12.0
  web: ^1.1.0

  # Context properties ($app_version, $device_model and so on)
  package_info_plus: ^10.0.0

  # For link questions in surveys (replaces the native openUrl)
  url_launcher: ^6.3.0

  # Session replay: PNG -> JPEG re-encoding (cuts traffic by 5-10x)
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Test-only. `platform` 3.0.0 references `Platform.packageRoot`, which was
  # removed from current Dart SDKs, and that breaks test compilation. It
  # arrives transitively through path_provider_android, so the lower bound is
  # raised here. This does not affect consumer apps — dev_dependencies are not
  # transitive.
  platform: ">=3.1.0 <4.0.0"

# Note: `dart_apitool` is used to diff the public API surface against the
# official plugin, but it is not added as a dev_dependency — its analyzer
# constraint conflicts with flutter_test's pin on meta. Use instead:
#   dart pub global activate dart_apitool

flutter:
